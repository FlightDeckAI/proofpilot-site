<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020609"><title>RightSeat Sky</title><body style="margin:0;background:#020609;color:#dff;font:16px -apple-system,sans-serif"><div id="l" style="display:grid;place-items:center;min-height:100vh">Loading RightSeat Sky…</div><script>(async()=>{try{const n=8,parts=await Promise.all(Array.from({length:n},(_,i)=>fetch(`payload-${i}.txt`).then(r=>{if(!r.ok)throw Error('payload '+i);return r.text()}))),s=atob(parts.join('')),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);const t=await new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.querySelector('#l').textContent='Unable to start RightSeat Sky: '+e.message}})()</script>
